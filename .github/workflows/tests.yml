name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.9"
          - os: ubuntu-latest
            python-version: "3.10"
          - os: ubuntu-latest
            python-version: "3.13"
          - os: macos-latest
            python-version: "3.13"
          - os: windows-latest
            python-version: "3.13"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile
        run: |
          python -m py_compile install.py
          python -m py_compile skills/open-source-contributor/scripts/contribution_radar.py
      - name: Test skill
        run: python -m unittest discover -s skills/open-source-contributor/tests -v
      - name: Test installer
        run: python -m unittest discover -s tests -v
      - name: Install demo dependencies
        if: matrix.python-version != '3.9'
        run: python -m pip install -r requirements-demos.txt
      - name: Test demos without API credentials
        if: matrix.python-version != '3.9'
        run: python -m unittest discover -s demo_tests -v
